<div class="title-bar">
  <div class="title-center">
    <img src="images/logo.png" alt="Logo" class="logo" />
    Nexy
  </div>
  <div class="main-menu">
    <button
      class="svg-button help-button"
      id="mainMenuButton"
      title="Menu"
      data-i18n-title="title.menu"
      aria-label="Menu"
      data-i18n-aria-label="title.menu"
      aria-haspopup="true"
      aria-expanded="false"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#f4f3f1"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="icon-dropdown hidden" id="mainDropdown" role="menu" aria-label="Menu">
      <a href="#" id="openHelpAction" role="menuitem" data-i18n="title.help">Help</a>
      <div class="icon-dropdown-divider admin-only-menu-item hidden" role="separator"></div>
      <a href="/manage_posts.html" class="admin-only-menu-item hidden" role="menuitem" data-i18n="title.managePosts"
        >Manage Posts</a
      >
      <a href="/manage_bots.html" class="admin-only-menu-item hidden" role="menuitem" data-i18n="title.manageBots"
        >Manage Bots</a
      >
      <a href="/login.html" id="adminAuthAction" role="menuitem" data-i18n="title.login">Login</a>
    </div>
  </div>
  <div class="title-language" aria-label="Language switcher">
    <label for="language-selector" class="title-language-label" data-i18n="common.language">Language</label>
    <select id="language-selector" class="title-language-select" aria-label="Language">
      <option value="en">EN</option>
      <option value="pt">PT</option>
    </select>
  </div>
</div>

<div id="helpInfoModal" class="psyop-info-modal hidden" role="dialog" aria-modal="true" aria-labelledby="helpInfoTitle">
  <div class="psyop-info-dialog" role="document">
    <div class="psyop-info-header">
      <h2 id="helpInfoTitle" data-i18n="title.nexyHelp">Nexy Help</h2>
      <button
        type="button"
        id="closeHelpInfo"
        class="psyop-info-close"
        aria-label="Close help dialog"
        data-i18n-aria-label="title.closeHelpDialog"
      >
        &times;
      </button>
    </div>
    <div id="helpInfoContent" class="psyop-info-content">
      <section>
        <h3 data-i18n="title.loadingHelp">Loading Help</h3>
        <p data-i18n="title.loadingHelpMessage">Please wait while the help content is loaded.</p>
      </section>
    </div>
  </div>
</div>
